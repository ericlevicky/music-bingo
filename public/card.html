<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bingo Card – Music Bingo</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="card-page">
  <nav>
    <span class="logo">🎵 Music Bingo</span>
    <a href="/">Home</a>
  </nav>

  <div class="container" style="padding-top:1.25rem; padding-bottom:7rem;">

    <!-- Status banner -->
    <div id="global-alert" style="margin-bottom:1rem;"></div>

    <!-- Player name prompt (shown before card loads) -->
    <div id="name-section" class="card section" style="max-width:420px; margin:0 auto;">
      <h2>Enter your name</h2>
      <p style="margin-bottom:1rem;">We'll use your name when you claim BINGO!</p>
      <div class="form-row">
        <div class="form-group">
          <label for="player-name">Your name</label>
          <input type="text" id="player-name" placeholder="e.g. Jane" autocomplete="off" />
        </div>
        <button class="btn btn-green" id="name-btn">Let's play</button>
      </div>
    </div>

    <!-- Card section (hidden until name entered) -->
    <div id="card-section" style="display:none;">

      <!-- Now playing -->
      <div id="now-playing" style="display:none;">
        <img id="np-art" src="" alt="" />
        <div class="np-info">
          <div class="np-title">
            <span class="pulse-dot"></span>
            <span id="np-title">—</span>
          </div>
          <div class="np-artist" id="np-artist"></div>
        </div>
        <a id="playlist-link" class="playlist-link" href="#" target="_blank" rel="noopener" style="display:none;" title="Open playlist in Spotify">🎧</a>
      </div>

      <div class="card-status-row">
        <div class="card-status-left">
          <h2 id="card-heading">
            <span id="card-number"></span>
            <button id="rename-btn" class="rename-btn" title="Change your name">✏️</button>
          </h2>
          <!-- Inline rename form (hidden by default) -->
          <div id="rename-form" class="rename-form">
            <div class="form-row rename-form-row">
              <input type="text" id="rename-input" class="rename-input" placeholder="New name…" autocomplete="off" />
              <button class="btn btn-green rename-save-btn" id="rename-save-btn">Save</button>
              <button class="btn btn-grey rename-cancel-btn" id="rename-cancel-btn">✕</button>
            </div>
            <div id="rename-msg" class="rename-msg"></div>
          </div>
          <div class="card-status-pills">
            <span id="game-status" class="status-pill status-idle">Waiting for game…</span>
            <span id="bingo-mode-label" class="status-pill status-idle"></span>
          </div>
        </div>
        <div class="card-status-right">
          <span id="marked-count" class="marked-count-label"></span>
        </div>
      </div>

      <!-- BINGO grid -->
      <div class="bingo-header">
        <span>B</span><span>I</span><span>N</span><span>G</span><span>O</span>
      </div>
      <div id="bingo-grid" class="bingo-grid"></div>

      <!-- BINGO claim button – lives in a sticky bar so it's always reachable -->
      <div id="bingo-bar">
        <div id="bingo-msg" class="bingo-msg"></div>
        <button id="bingo-btn" disabled>BINGO!</button>
      </div>

      <!-- Played songs reference (scrollable below the fold) -->
      <div id="songs-history" class="card songs-history-card">
        <h3>Songs played so far</h3>
        <ol id="played-list" class="played-list">
          <li id="no-songs-li" class="no-songs-placeholder">No songs played yet.</li>
        </ol>
      </div>
    </div>
  </div>

  <!-- Winner celebration overlay -->
  <div id="win-overlay" class="win-overlay" role="dialog" aria-modal="true">
    <div class="win-overlay-box">
      <span class="win-overlay-trophy">🏆</span>
      <div id="win-overlay-title" class="win-overlay-title"></div>
      <div id="win-overlay-sub" class="win-overlay-sub"></div>
      <button class="win-overlay-close" id="win-overlay-close">Awesome!</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.js"
    integrity="sha384-/Ko/tqVwPYurnBe+Mj8WWw+39WmyOZn/kU+neqXn4hRxGI575k07mB/hIekAT51+"
    crossorigin="anonymous"></script>
  <script src="/js/card.js"></script>
</body>
</html>
